<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>复制迁移策略管理 - 灾备管理平台</title>
    <!-- 路径修正：回到根目录 -->
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="../../monitor/css/monitor.css">
    <link rel="stylesheet" href="css/storage.css">
    <!-- 引入公共 JS -->
    <script src="../../common.js"></script>
    <script src="storage.js"></script>
</head>
<!-- ✅ 关键：添加 data-module="unstructured" -->
<body data-module="unstructured">
    
    <!-- ✅ 关键：业务内容必须包裹在 id="page-content" 中，common.js 会自动把它放到右侧 -->
    <div id="page-content">
        
        <!-- 面包屑 -->
        <div class="breadcrumb-bar">
            <ol class="breadcrumb">
                <li><a href="#">首页</a></li>
                <li><a href="#">非结构化备份</a></li>
                <li class="active">复制迁移策略管理</li>
            </ol>
            <span class="sys-time">系统时间：2026-05-19 17:25:59</span>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <div class="form-group">
                <label>策略名称：</label>
                <input type="text" class="input-search" placeholder="请输入策略名称">
            </div>
            <div class="form-group">
                <label>创建时间：</label>
                <input type="text" class="input-date" placeholder="请选择创建时间">
            </div>
            <button class="btn btn-primary">搜索</button>
            <div style="flex:1"></div>
            <button class="btn btn-danger btn-icon">
                <span>🗑</span> 删除策略
            </button>
            <button class="btn btn-primary btn-icon" onclick="openModal()">
                <span>⊕</span> 新建策略
            </button>
        </div>

        <!-- 数据表格 -->
        <div class="card data-table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th><input type="checkbox"></th>
                        <th>策略名称</th>
                        <th>策略类型</th>
                        <th>定时周期</th>
                        <th>上次运行时间</th>
                        <th>下次运行时间</th>
                        <th>创建时间</th>
                        <th>修改时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>testCEIV</td>
                        <td>手动</td>
                        <td>- -</td>
                        <td></td>
                        <td></td>
                        <td>2026-05-19 14:44:41</td>
                        <td></td>
                        <td>
                            <div class="action-btns" style="position: relative;">
                                <button class="btn-text">详情</button>
                                <div class="dropdown" style="position: relative; display: inline-block;">
                                    <button class="btn-text" onclick="toggleDropdown(this)">
                                        操作 <span>▼</span>
                                    </button>
                                    <div class="dropdown-menu" id="dropdown1">
                                        <a href="#">立即执行</a>
                                        <a href="#">编辑</a>
                                        <a href="#" style="color: #ff4d4f;">删除</a>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="pagination-bar">
            <span class="total">共1条数据</span>
            <div class="pagination">
                <button class="btn-page" disabled>&lt;</button>
                <button class="btn-page active">1</button>
                <button class="btn-page" disabled>&gt;</button>
            </div>
            <div class="page-size">
                <select>
                    <option>10条/页</option>
                </select>
            </div>
        </div>
    </div>
    <!-- 结束 page-content -->

    <!-- 添加策略弹窗 (保持不变) -->
        <!-- 添加策略弹窗 -->
    <div class="modal-overlay" id="policyModal">
        <div class="modal-box" style="width: 600px;">
            <div class="modal-header">
                <h3>添加策略</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <!-- 策略名称 -->
                <div class="form-row">
                    <div class="form-label"><span class="required"></span> 策略名称：</div>
                    <div class="form-input">
                        <input type="text" placeholder="请输入策略名称">
                    </div>
                </div>

                <!-- 源端存储 -->
                <div class="form-row">
                    <div class="form-label"><span class="required"></span> 源端存储：</div>
                    <div class="form-input">
                        <select>
                            <option value="">请选择源端存储</option>
                            <option>Storage-Source-01</option>
                            <option>Storage-Source-02</option>
                        </select>
                    </div>
                </div>

                <!-- 目标端存储 -->
                <div class="form-row">
                    <div class="form-label"><span class="required"></span> 目标端存储：</div>
                    <div class="form-input">
                        <select>
                            <option value="">请选择目标端存储</option>
                            <option>Storage-Target-01</option>
                            <option>Storage-Target-02</option>
                        </select>
                    </div>
                </div>

                <!-- 传输线程数 -->
                <div class="form-row">
                    <div class="form-label"><span class="required"></span> 传输线程数：</div>
                    <div class="form-input">
                        <input type="number" value="4" min="1" max="64">
                    </div>
                </div>

                <!-- 迁移条件 (组合控件) -->
                <div class="form-row">
                    <div class="form-label"><span class="required"></span> 迁移条件：</div>
                    <div class="form-input">
                        <div class="input-with-unit">
                            <input type="number" value="1" min="1" style="width: 80px;">
                            <div class="radio-group">
                                <label><input type="radio" name="timeUnit"> 小时</label>
                                <label><input type="radio" name="timeUnit" checked> 天</label>
                                <label><input type="radio" name="timeUnit"> 月</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 任务类型 -->
                <div class="form-row">
                    <div class="form-label"><span class="required"></span> 任务类型：</div>
                    <div class="form-input">
                        <div class="radio-group">
                            <label><input type="radio" name="taskType" checked> 复制</label>
                            <label><input type="radio" name="taskType"> 迁移</label>
                        </div>
                    </div>
                </div>

                <!-- 策略类型 -->
                <div class="form-row">
                    <div class="form-label"><span class="required"></span> 策略类型：</div>
                    <div class="form-input">
                        <div class="radio-group">
                            <label><input type="radio" name="policyType" checked> 手动</label>
                            <label><input type="radio" name="policyType"> 定时</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary">确定</button>
            </div>
        </div>
    </div>

    <script>
        // ... JS 代码保持不变 ...
        function openModal() {
            document.getElementById('policyModal').classList.add('show');
        }
        function closeModal() {
            document.getElementById('policyModal').classList.remove('show');
        }
        // ... 其他 JS ...
    </script>
</body>
</html>
