<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <base href="/DirSds/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色权限管理 - 灾备管理平台</title>
    <!-- 标准外部样式引入 -->
    <link rel="stylesheet" href="../common.css">
</head>
<body data-module="system">

    <!-- 业务内容插槽（common.js 会自动将其移入 .content 主区域） -->
    <div id="page-content">
        <!-- 面包屑导航 -->
        <nav class="breadcrumb">
            <a href="../index.html">首页</a> <span class="sep">/</span>
            <span>系统管理</span> <span class="sep">/</span>
            <span class="current">角色权限</span>
        </nav>

        <!-- 页面标题 -->
        <h1 class="page-title">角色权限</h1>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-primary">+ 新增角色</button>
                <button class="btn">修改</button>
                <button class="btn btn-danger">删除</button>
            </div>
            <div class="search-box">
                <input type="text" placeholder="角色名称">
                <select>
                    <option>全部角色</option>
                    <option>系统管理员</option>
                    <option>安全管理员</option>
                </select>
                <button class="btn">🔍 搜索</button>
                <button class="btn">↻ 重置</button>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="width: 40px;"><input type="checkbox"></th>
                        <th>角色名称</th>
                        <th>角色描述</th>
                        <th>关联用户数</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 数据行 1 -->
                    <tr>
                        <td><input type="checkbox"></td>
                        <td><strong>系统管理员</strong></td>
                        <td>拥有系统所有权限，包括用户管理、角色分配、备份策略配置等。</td>
                        <td>1</td>
                        <td><span class="status-badge success">启用</span></td>
                        <td>
                            <button class="btn-text">编辑</button>
                            <button class="btn-text">分配权限</button>
                            <button class="btn-text danger">删除</button>
                        </td>
                    </tr>
                    <!-- 数据行 2 -->
                    <tr>
                        <td><input type="checkbox"></td>
                        <td><strong>安全管理员</strong></td>
                        <td>负责安全策略配置，如 AD 对接、登录限制、密码策略等。</td>
                        <td>1</td>
                        <td><span class="status-badge success">启用</span></td>
                        <td>
                            <button class="btn-text">编辑</button>
                            <button class="btn-text">分配权限</button>
                            <button class="btn-text danger">删除</button>
                        </td>
                    </tr>
                    <!-- 数据行 3 -->
                    <tr>
                        <td><input type="checkbox"></td>
                        <td><strong>审计管理员</strong></td>
                        <td>仅拥有查看操作日志和审计报表的权限，不可修改配置。</td>
                        <td>1</td>
                        <td><span class="status-badge success">启用</span></td>
                        <td>
                            <button class="btn-text">编辑</button>
                            <button class="btn-text">分配权限</button>
                            <button class="btn-text danger">删除</button>
                        </td>
                    </tr>
                    <!-- 数据行 4 -->
                    <tr>
                        <td><input type="checkbox"></td>
                        <td><strong>数据库管理员</strong></td>
                        <td>负责数据库备份策略、任务管理及恢复测试。</td>
                        <td>2</td>
                        <td><span class="status-badge success">启用</span></td>
                        <td>
                            <button class="btn-text">编辑</button>
                            <button class="btn-text">分配权限</button>
                            <button class="btn-text danger">删除</button>
                        </td>
                    </tr>
                    <!-- 数据行 5 -->
                    <tr>
                        <td><input type="checkbox"></td>
                        <td><strong>非结构化恢复操作员</strong></td>
                        <td>仅能执行文件、邮件等非结构化数据的恢复操作。</td>
                        <td>3</td>
                        <td><span class="status-badge success">启用</span></td>
                        <td>
                            <button class="btn-text">编辑</button>
                            <button class="btn-text">分配权限</button>
                            <button class="btn-text danger">删除</button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 分页 -->
            <div class="pagination">
                <span style="line-height: 30px; margin-right: 10px; color: var(--gray-500);">共 5 条数据</span>
                <button>&lt;</button>
                <button class="active">1</button>
                <button>&gt;</button>
            </div>
        </div>
    </div>

    <!-- 引入全局布局与交互脚本 -->
    <script src="../common.js"></script>
</body>
</html>
